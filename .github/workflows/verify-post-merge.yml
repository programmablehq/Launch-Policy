name: Verify trusted main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-post-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-post-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24

    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Verify trusted Launch Policy revision
        working-directory: source
        run: npm test

      - name: Validate preserved historical application records
        if: matrix.node == 24
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/source"
          node "$source_root/scripts/verify-public-hook-application.mjs" \
            --verify-maintained \
            --repository-root "$source_root"

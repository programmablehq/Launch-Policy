name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-policy-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Candidate repository / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24

    steps:
      - name: Checkout candidate in ordinary read-only CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Verify policy, schemas, registry, compatibility, and history
        run: npm test

  required:
    if: always()
    needs:
      - repository
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24

    steps:
      - name: Require repository verification
        env:
          CANDIDATE_RESULT: ${{ needs.repository.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RESULT" == "success" ]]

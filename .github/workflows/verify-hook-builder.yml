name: GitHub launch intake is closed

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
    paths:
      - "submissions/**"
      - "canary-submissions/**"

permissions:
  contents: read

concurrency:
  group: closed-launch-intake-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intake-closed:
    name: Use the Custom Launch API
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Reject retired GitHub application transport
        shell: bash
        run: |
          set -euo pipefail
          echo "::error title=GitHub launch intake is closed::Create a key at https://programmable.market/developers/api-keys, then start at https://programmable.market/.well-known/programmable.json and follow the advertised V3 capabilities, CLI, https://programmable.market/developers/custom-launch-api-v1.md guide, and OpenAPI before submitting to POST https://api.programmable.market/v3/custom-launches. V1 creation is read-only compatibility."
          exit 1

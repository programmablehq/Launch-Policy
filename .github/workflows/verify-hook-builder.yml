name: GitHub launch intake is closed

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
    paths:
      - "submissions/**"
      - "canary-submissions/**"

permissions:
  contents: read

concurrency:
  group: closed-launch-intake-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intake-closed:
    name: Use the Custom Launch API
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Reject retired GitHub application transport
        shell: bash
        run: |
          set -euo pipefail
          echo "::error title=GitHub launch intake is closed::Create an API key at https://programmable.market/developers/api-keys and submit through https://programmable.market/developers/custom-launch-api-v1.md"
          exit 1
